# Kontrola kvality při každém pushi a pull requestu. Nasazení dělá Vercel (napojený na GitHub).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Firestore rules v emulátoru (Java + firebase-tools). Samostatný job – selhání neblokuje build.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run test:rules
